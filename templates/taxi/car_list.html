{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  {% if car_list %}
    <ul>
      {% for car in car_list %}
        <li><a href="{{ car.get_absolute_url }}">{{ car.id }} {{ car.model }} {{ car.manufacturer.name }}</a></li>
      {% empty %}
        <p>No cars!</p>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
