{% extends "base.html" %}

{% block content %}
<h1>Manufacturer List</h1>
  {% if manufacturer_list %}
    {% for manufacturer in object_list %}
    <ul>
        <li>{{ manufacturer.id }} {{ manufacturer.name }} {{ manufacturer.country }}</li>
    </ul>
    {% empty %}
      <p>No manufacturers found.</p>
    {% endfor %}
  {% endif %}
{% endblock %}
